<!doctype html>
<html lang="en" data-theme="daylight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marhab AI. Every customer who reaches out, answered.</title>
    <meta name="description" content="Marhab builds premium websites, AI reception and intelligent customer systems for businesses in Qatar: answering enquiries, capturing leads, booking appointments and following up automatically, 24/7." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Marhab AI. Every customer who reaches out, answered." />
    <meta property="og:description" content="Websites, AI reception and intelligent customer systems that turn enquiries into customers, automatically." />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f3f2ee" />
    <script>
      // The look: `daylight` (default) or `night`. `?theme=night` previews the
      // other without a rebuild; the choice is made here, before any paint.
      (function () {
        var t = new URLSearchParams(location.search).get("theme");
        if (t === "daylight" || t === "night") document.documentElement.dataset.theme = t;
        if (location.pathname === "/ar" || location.pathname.indexOf("/ar/") === 0) {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = document.documentElement.dataset.theme === "daylight" ? "#f3f2ee" : "#000000";
      })();
    </script>
    <link rel="preload" href="/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>

  </body>
</html>
